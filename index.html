<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sonoran Flight Deck | Phoenix, AZ Cirrus Training</title>
<meta name="description" content="Learn to fly in the heart of Phoenix, AZ — high-performance Cirrus training.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;700;800;900&family=Public+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0d0f1a;
    --bg-2:#171a2b;
    --bg-3:#1f2338;
    --accent:#e08a3c;
    --accent-ink:#241505;
    --text:#f5f1e8;
    --text-muted:#939ab3;
    --border:rgba(245,241,232,0.09);
    --border-strong:rgba(245,241,232,0.16);
  }

  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:'Public Sans', system-ui, -apple-system, sans-serif;
    min-height:100vh;
  }
  ::selection{background:var(--accent);color:var(--accent-ink);}
  .sr-only{
    position:absolute; width:1px; height:1px; padding:0; margin:-1px;
    overflow:hidden; clip:rect(0,0,0,0); white-space:nowrap; border:0;
  }

  /* ---------- HERO ---------- */
  .hero{
    position:relative;
    width:100%;
    height:min(64vh, 560px);
    min-height:340px;
    overflow:hidden;
    background-color:#0a0c17;
    background-image:url('hero.jpg');
    background-size:cover;
    background-position:center 62%;
  }
  @media (max-width:700px){
    .hero{background-position:22% 62%;}
  }

  .hero-scrim{
    position:absolute;inset:0;
    background:linear-gradient(180deg, rgba(10,12,23,.35) 0%, rgba(10,12,23,.32) 40%, rgba(10,12,23,.55) 74%, rgba(10,12,23,.88) 100%);
  }

  .logo-mark{
    position:absolute; top:22px; left:22px; z-index:2;
    width:34px; height:34px; border-radius:8px;
    background:rgba(13,15,26,.4); border:1px solid rgba(245,241,232,.3);
    display:flex; align-items:center; justify-content:center;
  }
  .logo-mark svg{width:19px;height:19px;stroke:var(--text);}

  .hero-copy{
    position:absolute; inset:0;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    padding:26px;
    z-index:2;
    text-align:center;
  }
  h1{
    font-family:'Big Shoulders Display', sans-serif;
    font-weight:900;
    font-size:clamp(30px, 6.6vw, 46px);
    line-height:0.98;
    letter-spacing:.01em;
    text-transform:uppercase;
    margin:0 0 10px;
    text-wrap:balance;
    color:#fbf8f2;
  }
  .sub{
    margin:0 auto; max-width:50ch;
    font-size:14.5px; line-height:1.5;
    color:rgba(245,241,232,.82);
  }

  /* ---------- CONTENT (full-bleed page, centered content column) ---------- */
  .content{width:100%;}
  .wrap{max-width:1040px; margin:0 auto;}

  .cols{
    display:grid;
    grid-template-columns:1.05fr 1fr;
    gap:0;
    border-top:1px solid var(--border);
  }
  @media (max-width:700px){
    .cols{grid-template-columns:1fr;}
  }

  .features{
    padding:30px 26px;
    border-right:1px solid var(--border);
  }
  @media (max-width:700px){
    .features{border-right:none; border-bottom:1px solid var(--border);}
  }
  .feature{
    display:flex; align-items:flex-start; gap:14px;
    padding:14px 0;
  }
  .feature + .feature{border-top:1px solid var(--border);}
  .feature .ficon{
    flex:none; width:30px;height:30px; border-radius:8px; margin-top:1px;
    background:var(--bg-3); display:flex; align-items:center; justify-content:center;
    border:1px solid var(--border-strong);
  }
  .feature .ficon svg{width:16px;height:16px;stroke:var(--accent);}
  .feature-text{display:flex; flex-direction:column; gap:3px;}
  .feature .ftitle{
    margin:0; font-size:12px; line-height:1.4; font-weight:700;
    text-transform:uppercase; letter-spacing:.01em;
    color:var(--text);
  }
  .feature .fsub{
    margin:0; font-size:12px; line-height:1.4; font-weight:400;
    color:var(--text-muted);
  }

  .form-panel{
    margin:30px 26px;
    padding:22px;
    background:var(--bg-2);
    border:1px solid var(--border-strong);
    border-radius:12px;
  }
  @media (max-width:700px){ .form-panel{margin:0 26px 30px;} }
  .panel-title{
    font-family:'Big Shoulders Display', sans-serif;
    font-weight:800; text-transform:uppercase; letter-spacing:.02em;
    font-size:19px; margin:0 0 16px; color:var(--text);
  }
  form{display:flex; flex-direction:column; gap:16px;}
  .field input{
    width:100%; padding:11px 12px;
    background:var(--bg-3); border:1px solid var(--border-strong);
    border-radius:8px; color:var(--text); font-size:13.5px;
    font-family:'Public Sans', sans-serif;
  }
  .field input::placeholder{color:rgba(147,154,179,.75);}
  .field input:focus-visible{outline:2px solid var(--accent); outline-offset:1px; border-color:var(--accent);}

  .radio-group{border:none; margin:0; padding:0;}
  .radio-group legend{
    padding:0; margin:0 0 8px;
    font-family:'Public Sans', sans-serif; font-weight:400; font-size:13.5px;
    color:rgba(147,154,179,.85);
  }
  .radio-row{display:flex; flex-wrap:wrap; gap:8px 18px;}
  .radio-row--inline{gap:22px;}
  .radio-option{
    display:flex; align-items:center; gap:7px;
    font-size:12.5px; color:var(--text); cursor:pointer;
  }
  .radio-option input{accent-color:var(--accent); width:15px; height:15px; margin:0; flex:none;}

  .cta{
    margin-top:6px; padding:13px 16px; border:none; border-radius:8px;
    background:var(--accent); color:var(--accent-ink);
    font-family:'Public Sans', sans-serif; font-weight:700; font-size:13px;
    letter-spacing:.04em; text-transform:uppercase; cursor:pointer;
    transition:transform .15s ease, background .15s ease;
  }
  .cta:hover{background:#eb9c52; transform:translateY(-1px);}
  .cta:focus-visible{outline:2px solid var(--text); outline-offset:2px;}

  /* ---------- FOOTER ---------- */
  footer{
    display:flex; align-items:center; justify-content:center;
    padding:20px 26px 30px;
  }
  .socials{display:flex; gap:10px;}
  .socials a{
    width:32px; height:32px; border-radius:7px; border:1px solid var(--border-strong);
    display:flex; align-items:center; justify-content:center;
    color:var(--text-muted); transition:color .15s ease, border-color .15s ease;
    text-decoration:none;
  }
  .socials a:hover{color:var(--accent); border-color:var(--accent);}
  .socials svg{width:15px;height:15px;}

  /* ---------- CLICKABLE / MODAL ---------- */
  .feature{
    width:100%; background:none; border:none; text-align:left;
    font-family:inherit; color:inherit; cursor:pointer;
  }
  .feature:hover .ftitle{color:var(--accent);}
  .feature:focus-visible{outline:2px solid var(--accent); outline-offset:2px; border-radius:6px;}

  .logo-mark{cursor:pointer;}
  .logo-mark:hover{border-color:var(--accent);}
  .logo-mark:hover svg{stroke:var(--accent);}
  .logo-mark:focus-visible{outline:2px solid var(--accent); outline-offset:2px;}

  .modal-overlay{
    position:fixed; inset:0; z-index:50;
    background:rgba(8,9,15,.72);
    display:flex; align-items:center; justify-content:center;
    padding:20px;
    opacity:0; visibility:hidden;
    transition:opacity .18s ease;
  }
  .modal-overlay.open{opacity:1; visibility:visible;}
  .modal-box{
    background:var(--bg-2); border:1px solid var(--border-strong); border-radius:14px;
    max-width:460px; width:100%;
    position:relative;
    transform:translateY(10px);
    transition:transform .18s ease;
    overflow:hidden;
    max-height:calc(100vh - 40px);
    display:flex; flex-direction:column;
  }
  .modal-overlay.open .modal-box{transform:translateY(0);}
  .modal-img{
    width:100%; height:190px; object-fit:cover; display:block;
    background:var(--bg-3);
    flex:none;
  }
  .modal-img[hidden]{display:none;}
  .modal-content{padding:22px 24px 24px; overflow-y:auto;}
  .modal-close{
    position:absolute; top:14px; right:14px; width:28px; height:28px;
    border-radius:7px; border:1px solid rgba(245,241,232,.35); background:rgba(13,15,26,.55);
    color:var(--text); display:flex; align-items:center; justify-content:center;
    cursor:pointer; font-size:16px; line-height:1; z-index:1;
    backdrop-filter:blur(2px);
  }
  .modal-close:hover{color:var(--accent); border-color:var(--accent);}
  .modal-title{
    font-family:'Big Shoulders Display', sans-serif;
    font-weight:800; text-transform:uppercase; letter-spacing:.02em;
    font-size:20px; margin:0 0 12px; color:var(--text);
  }
  .modal-body{margin:0; font-size:13.5px; line-height:1.65; color:var(--text-muted);}

  @media (prefers-reduced-motion:reduce){
    .modal-overlay, .modal-box{transition:none;}
  }
</style>
</head>
<body>

<div class="hero">
  <div class="hero-scrim"></div>

  <button class="logo-mark" type="button" aria-label="About"
    data-title="About the Instructor"
    data-body="Add a short bio here — your name, certificates and ratings, flight hours, and what brought you to teach in Phoenix. This is placeholder copy; swap it for your own story.">
    <svg viewBox="0 0 24 24" fill="none" stroke-width="1.6"><circle cx="12" cy="12" r="9.2"/><path d="M12 4.2v3.4M12 16.4v3.4M4.2 12h3.4M16.4 12h3.4"/><path d="M12 8l2.6 4-2.6 4-2.6-4z"/></svg>
  </button>

  <div class="hero-copy">
    <h1>Learn To Fly In The Heart of Phoenix AZ</h1>
  </div>
</div>

<div class="content">
  <div class="wrap">
    <div class="cols">
      <div class="features">
        <button class="feature" type="button"
          data-title="Train with the Most Modern Aircraft"
          data-img="feature1.jpg"
          data-body="The SR20 and SR22 are the best-selling piston aircraft in the world, sharing the same side-yoke ergonomics and Garmin-based glass cockpit. The SR20 is the ideal primary trainer — light, forgiving, and efficient. Step up to the SR22 for more useful load, more range, and true cross-country performance as your training advances.">
          <span class="ficon">
            <svg viewBox="0 0 24 24" fill="none" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M2.5 14.5l8-2.2M10.5 12.3L15 7l1.7.5-1.8 5.6 4.9 1.4-.4 1.5-5.3-.4-2.6 4.3-1.5-.4.9-4.9-2.2-1.5z"/></svg>
          </span>
          <span class="feature-text">
            <p class="ftitle">Train with the Most Modern Aircraft</p>
            <p class="fsub">Cirrus SR20 and SR22</p>
          </span>
        </button>
        <button class="feature" type="button"
          data-title="High-Performance Features"
          data-img="feature2.jpg"
          data-body="Our aircraft come equipped with a dual-axis autopilot and a full glass cockpit — primary flight display, engine sensor data, comprehensive suite of navigation equipment and advanced flight planning. Advanced capabilities for all-weather navigation and flying in low-visibility conditions.">
          <span class="ficon">
            <svg viewBox="0 0 24 24" fill="none" stroke-width="1.7" stroke-linecap="round"><circle cx="12" cy="12" r="8.5"/><path d="M12 12l4-3"/><circle cx="12" cy="12" r="1.2" fill="currentColor"/></svg>
          </span>
          <span class="feature-text">
            <p class="ftitle">High-Performance Features</p>
            <p class="fsub">Dual Axis Autopilot + Glass Cockpit Displays</p>
          </span>
        </button>
        <button class="feature" type="button"
          data-title="Advanced Safety Features"
          data-img="feature3.jpg"
          data-body="Safety is the number one priority in aviation. We take safety very seriously. Innovations like Cirrus Airframe Parachute System (CAPS) and AmSafe Aircraft Airbags bring safety to previously unchartered territory - making single engine flying the safest ever possible.">
          <span class="ficon">
            <svg viewBox="0 0 24 24" fill="none" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l7 3v5.5c0 4.4-3 8.1-7 9.5-4-1.4-7-5.1-7-9.5V6z"/><path d="M9 12l2 2 4-4.2"/></svg>
          </span>
          <span class="feature-text">
            <p class="ftitle">Advanced Safety Features</p>
            <p class="fsub">Cirrus Aircraft Parachute System (CAPS) + AmSafe Aircraft Airbags</p>
          </span>
        </button>
      </div>

      <div class="form-panel">
        <h2 class="panel-title">Get In Touch With A Mentor</h2>
        <form id="auditForm">
          <!--
            Form backend: Web3Forms (web3forms.com) — free, no account/password
            needed beyond an access key emailed to you instantly.
          -->
          <input type="hidden" name="access_key" value="ceab2eb4-7886-4a5a-bb11-8d9fbe5c3f1d">
          <input type="hidden" name="subject" value="New Training Inquiry — Sonoran Flight Deck">
          <input type="checkbox" name="botcheck" class="sr-only" tabindex="-1" autocomplete="off">
          <div class="field">
            <label class="sr-only" for="name">Name</label>
            <input id="name" name="name" type="text" placeholder="Your Name" required>
          </div>
          <div class="field">
            <label class="sr-only" for="email">Email Address</label>
            <input id="email" name="email" type="email" placeholder="Your Email Address" required>
          </div>
          <div class="field">
            <label class="sr-only" for="phone">Phone Number</label>
            <input id="phone" name="phone" type="tel" placeholder="Your Phone Number">
          </div>

          <fieldset class="radio-group">
            <legend>Prior Aviation Experience</legend>
            <div class="radio-row">
              <label class="radio-option"><input type="checkbox" name="experience" value="none">No Experience</label>
              <label class="radio-option"><input type="checkbox" name="experience" value="sim">Flight Simulator</label>
              <label class="radio-option"><input type="checkbox" name="experience" value="enthusiast">Aviation Fan/Enthusiast</label>
              <label class="radio-option"><input type="checkbox" name="experience" value="some">Some Flying Experience</label>
              <label class="radio-option"><input type="checkbox" name="experience" value="prior">Prior Training</label>
              <label class="radio-option"><input type="checkbox" name="experience" value="advanced">Advanced</label>
            </div>
          </fieldset>

          <fieldset class="radio-group">
            <legend>Have You Ever Taken a Discovery Flight?</legend>
            <div class="radio-row radio-row--inline">
              <label class="radio-option"><input type="radio" name="discovery" value="yes">Yes</label>
              <label class="radio-option"><input type="radio" name="discovery" value="no">No</label>
            </div>
          </fieldset>

          <button class="cta" type="submit">Start Now</button>
        </form>
      </div>
    </div>

    <footer>
      <div class="socials">
        <a href="#" aria-label="LinkedIn"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M4.98 3.5a2.5 2.5 0 11-.02 5.001A2.5 2.5 0 014.98 3.5zM3 9h4v12H3zM10 9h3.8v1.64h.05c.53-.98 1.83-2.02 3.77-2.02 4.03 0 4.78 2.53 4.78 5.83V21h-4v-5.86c0-1.4-.03-3.2-2-3.2-2 0-2.3 1.5-2.3 3.1V21h-4z"/></svg></a>
        <a href="#" aria-label="Instagram"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><rect x="3.5" y="3.5" width="17" height="17" rx="4.5"/><circle cx="12" cy="12" r="4"/><circle cx="17.2" cy="6.8" r="1"/></svg></a>
      </div>
    </footer>
  </div>
</div>

<div class="modal-overlay" id="modalOverlay" aria-hidden="true">
  <div class="modal-box" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
    <button class="modal-close" id="modalClose" aria-label="Close">&times;</button>
    <img class="modal-img" id="modalImg" alt="" hidden>
    <div class="modal-content">
      <h3 class="modal-title" id="modalTitle"></h3>
      <p class="modal-body" id="modalBody"></p>
    </div>
  </div>
</div>

<script>
  (function(){
    // ---- shared popup modal (feature items, logo mark, form confirmation) ----
    var overlay = document.getElementById('modalOverlay');
    var modalTitle = document.getElementById('modalTitle');
    var modalBody = document.getElementById('modalBody');
    var modalImg = document.getElementById('modalImg');
    var closeBtn = document.getElementById('modalClose');
    var lastFocusEl = null;

    function showModal(title, body, imgSrc, focusReturnEl){
      modalTitle.textContent = title || '';
      modalBody.textContent = body || '';
      if (imgSrc){
        modalImg.src = imgSrc;
        modalImg.alt = title || '';
        modalImg.hidden = false;
      } else {
        modalImg.removeAttribute('src');
        modalImg.hidden = true;
      }
      lastFocusEl = focusReturnEl || null;
      overlay.classList.add('open');
      overlay.setAttribute('aria-hidden', 'false');
      closeBtn.focus();
      document.addEventListener('keydown', onKeydown);
    }
    function closeModal(){
      overlay.classList.remove('open');
      overlay.setAttribute('aria-hidden', 'true');
      document.removeEventListener('keydown', onKeydown);
      if (lastFocusEl) lastFocusEl.focus();
    }
    function onKeydown(e){
      if (e.key === 'Escape') closeModal();
    }

    document.querySelectorAll('[data-title]').forEach(function(el){
      el.addEventListener('click', function(){
        showModal(el.getAttribute('data-title'), el.getAttribute('data-body'), el.getAttribute('data-img'), el);
      });
    });
    closeBtn.addEventListener('click', closeModal);
    overlay.addEventListener('click', function(e){
      if (e.target === overlay) closeModal();
    });

    // ---- form submit: send to Web3Forms + show confirmation modal ----
    var form = document.getElementById('auditForm');
    var btn = form.querySelector('.cta');
    var originalBtnLabel = btn.textContent;

    form.addEventListener('submit', function(e){
      e.preventDefault();

      var data = new FormData(form);
      // Fold the "experience" checkboxes into one readable field before sending.
      var experience = data.getAll('experience').join(', ') || 'Not specified';
      data.set('experience', experience);

      btn.disabled = true;
      btn.textContent = 'Sending…';

      fetch('https://api.web3forms.com/submit', {
        method: 'POST',
        headers: { 'Accept': 'application/json' },
        body: data
      })
        .then(function(res){ return res.json(); })
        .then(function(json){
          if (json && json.success){
            showModal(
              "You're All Set",
              "Thanks — your details have been submitted. A mentor will be reaching out shortly.",
              null,
              btn
            );
            form.reset();
          } else {
            showModal(
              'Something Went Wrong',
              "We couldn't submit your details right now. Please try again, or email us directly at info@pilotconsciousness.com.",
              null,
              btn
            );
          }
        })
        .catch(function(){
          showModal(
            'Something Went Wrong',
            "We couldn't submit your details right now. Please try again, or email us directly at info@pilotconsciousness.com.",
            null,
            btn
          );
        })
        .finally(function(){
          btn.disabled = false;
          btn.textContent = originalBtnLabel;
        });
    });
  })();
</script>
</body>
</html>
